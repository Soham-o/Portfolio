<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="generator" content="github-sync">
{{head}}
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../style.css">
</head>
<body class="dark-mode">
    <!-- Generated by tools/sync from public GitHub data. Edit templates/project.html, not this file. -->

    <div class="transition-loader">
        <div class="layer layer-1"></div>
        <div class="layer layer-2"></div>
        <div class="layer layer-3"></div>
    </div>

    <header class="navbar">
        <nav class="nav-container">
            <div class="nav-links">
                <a href="../index.html" class="link">Home</a>
                <a href="../about.html" class="link">About</a>
                <a href="../projects.html" class="link active">Projects</a>
                <a href="../journey.html" class="link">Journey</a>
            </div>

            <div class="nav-logo">
                <div class="logo-circle">SP</div>
            </div>

            <div class="nav-socials">
                <a href="https://github.com/{{username}}" target="_blank" rel="noopener"><i class="fab fa-github"></i></a>
                <a href="{{linkedin}}" target="_blank" rel="noopener"><i class="fab fa-linkedin-in"></i></a>

                <button id="theme-switcher" class="theme-btn">
                    <div class="sun-container">
                        <div class="sun-core"></div>
                        <div class="sun-rays"></div>
                    </div>
                    <div class="moon-stars">
                        <div class="moon"></div>
                        <div class="star s1"></div>
                        <div class="star s2"></div>
                    </div>
                </button>
            </div>
        </nav>
    </header>

{{main}}

    <footer class="footer">
        <div class="footer-content">
            <span><span id="footer-year"></span> &copy; All Rights Reserved.</span>
            <div class="built-by">Built with <span class="heart">♡</span> by <a href="../index.html">{{ownerName}}</a></div>
            <a href="mailto:{{email}}">Say Hello</a>
        </div>
    </footer>

    <script src="../script.js"></script>
    <script src="../github-sync.js"></script>
</body>
</html>
