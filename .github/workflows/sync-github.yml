# Keeps the portfolio in sync with public GitHub repositories.
#
# When it runs:
#   • hourly at :17 (scheduled reconciliation — GitHub may delay scheduled runs by several minutes)
#   • when you push edits to content/ or templates/ (re-renders immediately)
#   • manually from the Actions tab ("Run workflow"; tick "full" to re-fetch every README)
#   • instantly-ish, if the optional webhook relay (relay/) sends a `github-sync` repository_dispatch
#
# Security boundary — three jobs, least privilege each:
#   A · sync    contents:read, pages:read. Fetches public GitHub data, parses + sanitizes READMEs,
#               renders pages, validates them and uploads ONLY the changed generated files as an
#               artifact (with a SHA-256 manifest). It never holds a write-capable token.
#   B · commit  contents:write. Never installs npm packages and never runs the README pipeline.
#               Applies the artifact with dependency-free code that enforces a path allowlist and the
#               hashes, re-validates, then commits. The token is visible only to the git fetch/push steps.
#   C · deploy  pages:write, id-token:write. Reuses static.yml to publish the exact pushed commit,
#               only when something changed and GitHub Pages is enabled.
# If any job fails, nothing is committed/deployed and the currently deployed site stays live.
name: Sync GitHub projects

on:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: ["main"]
    paths: ["content/**", "templates/**"]
  workflow_dispatch:
    inputs:
      full:
        description: "Full refresh (re-fetch every README and manifest)"
        type: boolean
        default: false
  repository_dispatch:
    types: [github-sync]

# No default permissions; every job declares exactly what it needs.
permissions: {}

# One sync at a time; a newer trigger waits (and supersedes any older queued one) instead of racing.
concurrency:
  group: github-sync
  cancel-in-progress: false

jobs:
  sync:
    name: "A · Sync (read-only)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    outputs:
      changed: ${{ steps.package.outputs.changed }}
      base: ${{ steps.package.outputs.base }}
      pages: ${{ steps.pages.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Test
        run: npm test

      # Fails (harmlessly) while GitHub Pages is not enabled; the deploy job is then skipped.
      - name: Detect Pages URL
        id: pages
        uses: actions/configure-pages@v6
        continue-on-error: true

      - name: Sync from GitHub
        env:
          # Read-only: this job's GITHUB_TOKEN only has contents:read + pages:read. An optional
          # PORTFOLIO_SYNC_TOKEN must be a fine-grained public read-only token; classic tokens with
          # write scopes are refused by the sync itself.
          GITHUB_TOKEN: ${{ secrets.PORTFOLIO_SYNC_TOKEN || github.token }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          SYNC_FULL: ${{ inputs.full == true || github.event.client_payload.full == true }}
        run: npm run sync

      - name: Validate generated files
        run: npm run check

      - name: Package generated changes
        id: package
        run: |
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          node tools/sync/package.mjs --root . --out "$RUNNER_TEMP/sync-output" --base "$(git rev-parse HEAD)"

      - name: Upload generated changes
        if: steps.package.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: sync-output-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sync-output
          retention-days: 1
          if-no-files-found: error

  commit:
    name: "B · Commit generated files"
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      pushed: ${{ steps.push.outputs.pushed }}
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - name: Checkout the commit the sync was built from
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.sync.outputs.base }}
          fetch-depth: 0
          persist-credentials: false   # the token is only handed to individual git commands below

      - name: Download generated changes
        uses: actions/download-artifact@v8
        with:
          name: sync-output-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sync-output

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # No npm install, no credentials: dependency-free code that enforces the path allowlist,
      # verifies every file hash, applies writes/deletions (stale pages) and validates the result.
      - name: Apply and validate
        run: node tools/sync/apply.mjs --root . --artifact "$RUNNER_TEMP/sync-output"

      - name: Commit
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- data projects projects.html journey.html sitemap.xml
          if git diff --cached --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --cached --name-only | grep -qvE '^(data/|projects/|projects\.html$|journey\.html$|sitemap\.xml$)'; then
            echo "::error::Refusing to commit a path outside the generated files"; exit 1
          fi
          # [skip ci] stops push-triggered workflows; job C deploys this commit instead.
          git commit -q -m "chore(sync): update portfolio from GitHub [skip ci]"
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Rebase onto the latest branch
        if: steps.commit.outputs.committed == 'true'
        env:
          PUSH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: bash tools/sync/git-publish.sh rebase

      # Re-check after the rebase (no credentials in this step).
      - name: Validate rebased tree
        if: steps.commit.outputs.committed == 'true'
        run: node tools/sync/check.mjs .

      - name: Push
        id: push
        env:
          PUSH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          COMMITTED: ${{ steps.commit.outputs.committed }}
        run: |
          if [ "$COMMITTED" != "true" ]; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Plain fast-forward push, never forced. A rejected push loses nothing; the next run retries.
          out=$(bash tools/sync/git-publish.sh push)
          echo "$out" >> "$GITHUB_OUTPUT"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

  deploy:
    name: "C · Deploy"
    needs: [sync, commit]
    # Deploy only when a commit was pushed AND GitHub Pages is enabled for this repository.
    if: needs.commit.outputs.pushed == 'true' && needs.sync.outputs.pages == 'success'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/static.yml
    with:
      ref: ${{ needs.commit.outputs.sha }}
