# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Called by sync-github.yml after it commits freshly synced data
  workflow_call:
    inputs:
      ref:
        description: "Commit to deploy (defaults to the triggering commit)"
        type: string
        required: false
        default: ""

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Single deploy job since we're just deploying
  deploy:
    # Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
    # However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
    # (Job-level so it also applies when this workflow is called from sync-github.yml.)
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Assemble site
        # Publish the website only — tooling, tests and the sync cache stay out of the public site.
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git' --exclude '.github' --exclude '_site' --exclude 'node_modules' \
            --exclude 'tools' --exclude 'tests' --exclude 'relay' --exclude 'templates' --exclude 'docs' \
            --exclude 'content' --exclude 'data/cache' --exclude 'data/.sync.lock' \
            --exclude 'package.json' --exclude 'package-lock.json' --exclude '.gitignore' \
            ./ _site/
          test -f _site/index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
