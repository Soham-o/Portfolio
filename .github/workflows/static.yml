# Simple workflow for deploying static content to Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Called by sync-github.yml after it commits freshly synced data
  workflow_call:
    inputs:
      ref:
        description: "Commit to deploy (defaults to the triggering commit)"
        type: string
        required: false
        default: ""

# No default permissions; each job asks for what it needs.
permissions: {}

jobs:
  # Is GitHub Pages enabled (Settings → Pages → Source: GitHub Actions)? If not, skip deploying with a
  # clear warning instead of failing every push.
  pages-status:
    runs-on: ubuntu-latest
    permissions:
      pages: read
    outputs:
      enabled: ${{ steps.pages.outcome == 'success' }}
    steps:
      - name: Check Pages configuration
        id: pages
        uses: actions/configure-pages@v6
        continue-on-error: true
      - name: Report that the site was not deployed
        if: steps.pages.outcome != 'success'
        run: |
          echo "::warning title=Site not deployed::GitHub Pages is not enabled for this repository. Enable it under Settings → Pages → Source: GitHub Actions, then re-run this workflow."
          {
            echo "### ⚠️ Site not deployed"
            echo "GitHub Pages is not enabled for this repository, so nothing was published."
            echo "Enable it under **Settings → Pages → Build and deployment → Source: GitHub Actions**, then re-run this workflow."
          } >> "$GITHUB_STEP_SUMMARY"

  # Single deploy job since we're just deploying
  deploy:
    needs: pages-status
    if: needs.pages-status.outputs.enabled == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    # Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
    # However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
    # (Job-level so it also applies when this workflow is called from sync-github.yml.)
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Assemble site
        # Allowlist: only the public website (pages, styles, scripts, images, generated project pages,
        # sitemap). Tooling, tests, content/, data/ (sync state + caches) and docs are never published.
        run: bash tools/assemble-site.sh _site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
